<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 528"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a6fd0"/>
    </marker>
  </defs>
  <rect width="1040" height="528" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" fill="#6b7280">レベル3　コンポーネント図：Webアプリの中の部品</text>

  <!-- Webアプリ -->
  <rect x="32" y="48" width="976" height="296" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="48" y="72" font-size="12" fill="#6b7280">QR Drop Webアプリ（1台のブラウザの中）</text>

  <rect x="420" y="88" width="200" height="72" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="520" y="114" font-size="15" text-anchor="middle" fill="#1f2937">画面</text>
  <text x="520" y="134" font-size="11" text-anchor="middle" fill="#6b7280">ボタン・QR表示・ファイル一覧</text>
  <text x="520" y="150" font-size="10" text-anchor="middle" fill="#9ca3af">main.ts</text>

  <!-- 呼び出しの幹と枝 -->
  <path d="M520,160 V196 M136,196 H904" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <text x="532" y="184" font-size="11" fill="#6b7280">操作に応じて呼び出す</text>
  <line x1="136" y1="196" x2="136" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="328" y1="196" x2="328" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="520" y1="196" x2="520" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="712" y1="196" x2="712" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="904" y1="196" x2="904" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="52" y="232" width="168" height="80" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="136" y="260" font-size="15" text-anchor="middle" fill="#1f2937">QR</text>
  <text x="136" y="280" font-size="11" text-anchor="middle" fill="#6b7280">QRを描く・カメラで読む</text>
  <text x="136" y="298" font-size="10" text-anchor="middle" fill="#9ca3af">qr.ts</text>

  <rect x="244" y="232" width="168" height="80" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="328" y="260" font-size="15" text-anchor="middle" fill="#1f2937">1回スキャン接続</text>
  <text x="328" y="280" font-size="11" text-anchor="middle" fill="#6b7280">秘密から鍵を作り中継で接続</text>
  <text x="328" y="298" font-size="10" text-anchor="middle" fill="#9ca3af">relay.ts（Trystero）</text>

  <rect x="436" y="232" width="168" height="80" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="520" y="260" font-size="15" text-anchor="middle" fill="#1f2937">2回スキャン接続</text>
  <text x="520" y="280" font-size="11" text-anchor="middle" fill="#6b7280">接続情報をQRで直接交換</text>
  <text x="520" y="298" font-size="10" text-anchor="middle" fill="#9ca3af">rtc.ts ／ signal.ts</text>

  <rect x="628" y="232" width="168" height="80" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="712" y="260" font-size="15" text-anchor="middle" fill="#1f2937">ファイル転送</text>
  <text x="712" y="280" font-size="11" text-anchor="middle" fill="#6b7280">分割して送り、組み立てる</text>
  <text x="712" y="298" font-size="10" text-anchor="middle" fill="#9ca3af">transfer.ts</text>

  <rect x="820" y="232" width="168" height="80" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="904" y="260" font-size="15" text-anchor="middle" fill="#1f2937">確認コード</text>
  <text x="904" y="280" font-size="11" text-anchor="middle" fill="#6b7280">鍵の指紋から4桁を作る</text>
  <text x="904" y="298" font-size="10" text-anchor="middle" fill="#9ca3af">verify.ts</text>

  <!-- 外側 -->
  <rect x="204" y="440" width="176" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="292" y="468" font-size="15" text-anchor="middle" fill="#1f2937">公開Nostrリレー</text>
  <text x="292" y="488" font-size="11" text-anchor="middle" fill="#6b7280">接続情報を中継</text>

  <rect x="432" y="440" width="176" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="520" y="468" font-size="15" text-anchor="middle" fill="#1f2937">Cloudflare STUN</text>
  <text x="520" y="488" font-size="11" text-anchor="middle" fill="#6b7280">外側のIPアドレスを教える</text>

  <rect x="660" y="440" width="176" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="748" y="468" font-size="15" text-anchor="middle" fill="#1f2937">相手の端末</text>
  <text x="748" y="488" font-size="11" text-anchor="middle" fill="#6b7280">同じWebアプリが動いている</text>

  <line x1="292" y1="312" x2="292" y2="440" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="282" y="388" font-size="11" text-anchor="end" fill="#6b7280">暗号化した接続情報</text>

  <line x1="380" y1="312" x2="468" y2="440" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="520" y1="312" x2="520" y2="440" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="530" y="388" font-size="11" fill="#6b7280">外側のアドレスを聞く</text>

  <line x1="736" y1="312" x2="736" y2="440" stroke="#7a6fd0" stroke-width="1.8" marker-start="url(#arrow-p)" marker-end="url(#arrow-p)"/>
  <text x="748" y="380" font-size="11" fill="#1f2937">ファイルを直接送り合う</text>
  <text x="748" y="396" font-size="11" fill="#6b7280">（WebRTC・暗号化）</text>
</svg>
