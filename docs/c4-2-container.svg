<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a6fd0"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" fill="#6b7280">レベル2　コンテナ図：何がどこで動き、どうつながるか（QRを1回読む方式）</text>

  <!-- 配信 -->
  <rect x="340" y="44" width="200" height="60" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="440" y="70" font-size="15" text-anchor="middle" fill="#1f2937">GitHub Pages</text>
  <text x="440" y="90" font-size="11" text-anchor="middle" fill="#6b7280">アプリを配信するだけ</text>

  <line x1="372" y1="104" x2="252" y2="216" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="508" y1="104" x2="628" y2="216" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="440" y="146" font-size="11" text-anchor="middle" fill="#6b7280">アプリ（HTML・JS）を配信</text>

  <!-- QR Drop -->
  <rect x="40" y="176" width="800" height="168" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="56" y="198" font-size="12" fill="#6b7280">QR Drop（ブラウザの中で動く）</text>

  <rect x="72" y="216" width="240" height="88" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="192" y="250" font-size="15" text-anchor="middle" fill="#1f2937">端末AのWebアプリ</text>
  <text x="192" y="272" font-size="11" text-anchor="middle" fill="#6b7280">QRを表示する側</text>

  <rect x="568" y="216" width="240" height="88" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="688" y="250" font-size="15" text-anchor="middle" fill="#1f2937">端末BのWebアプリ</text>
  <text x="688" y="272" font-size="11" text-anchor="middle" fill="#6b7280">QRを読み取る側</text>

  <line x1="312" y1="242" x2="568" y2="242" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="440" y="232" font-size="11" text-anchor="middle" fill="#6b7280">① QRで使い捨ての秘密を渡す</text>

  <line x1="312" y1="282" x2="568" y2="282" stroke="#7a6fd0" stroke-width="1.8" marker-start="url(#arrow-p)" marker-end="url(#arrow-p)"/>
  <text x="440" y="302" font-size="11" text-anchor="middle" fill="#1f2937">③ ファイルを直接送り合う</text>
  <text x="440" y="318" font-size="11" text-anchor="middle" fill="#6b7280">（WebRTC・暗号化）</text>

  <!-- 接続の準備 -->
  <rect x="200" y="424" width="480" height="112" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="216" y="446" font-size="12" fill="#6b7280">接続の準備だけに使う外部サービス（ファイルは通らない）</text>

  <rect x="220" y="460" width="212" height="60" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="326" y="486" font-size="15" text-anchor="middle" fill="#1f2937">公開Nostrリレー</text>
  <text x="326" y="506" font-size="11" text-anchor="middle" fill="#6b7280">暗号化された接続情報を中継</text>

  <rect x="448" y="460" width="212" height="60" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="554" y="486" font-size="15" text-anchor="middle" fill="#1f2937">Cloudflare STUN</text>
  <text x="554" y="506" font-size="11" text-anchor="middle" fill="#6b7280">外側のIPアドレスを教える</text>

  <line x1="192" y1="304" x2="280" y2="424" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="222" y="388" font-size="11" text-anchor="end" fill="#6b7280">② 接続の準備をする</text>
  <line x1="688" y1="304" x2="600" y2="424" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="658" y="388" font-size="11" fill="#6b7280">② 接続の準備をする</text>
</svg>
