<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="488" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" fill="#6b7280">レベル1　コンテキスト図：だれが使い、何とつながるか</text>

  <!-- 利用者 -->
  <rect x="80" y="48" width="200" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="180" y="76" font-size="15" text-anchor="middle" fill="#1f2937">Aさん</text>
  <text x="180" y="96" font-size="11" text-anchor="middle" fill="#6b7280">PCやスマホのブラウザで使う</text>

  <rect x="520" y="48" width="200" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="620" y="76" font-size="15" text-anchor="middle" fill="#1f2937">Bさん</text>
  <text x="620" y="96" font-size="11" text-anchor="middle" fill="#6b7280">PCやスマホのブラウザで使う</text>

  <!-- 中核 -->
  <rect x="220" y="192" width="360" height="80" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="400" y="226" font-size="16" text-anchor="middle" fill="#1f2937">QR Drop</text>
  <text x="400" y="248" font-size="11" text-anchor="middle" fill="#6b7280">QRで相手を確かめ、端末どうしで直接ファイルを送る</text>

  <line x1="180" y1="112" x2="300" y2="192" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="226" y="158" font-size="11" text-anchor="end" fill="#6b7280">QRを表示する／ファイルを送る</text>
  <line x1="620" y1="112" x2="500" y2="192" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="574" y="158" font-size="11" fill="#6b7280">QRを読む／ファイルを受け取る</text>

  <!-- 外部サービス -->
  <rect x="16" y="360" width="768" height="112" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="32" y="460" font-size="12" fill="#6b7280">外部サービス（ファイルは通らず、保存もされない）</text>

  <rect x="32" y="376" width="216" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="140" y="404" font-size="15" text-anchor="middle" fill="#1f2937">GitHub Pages</text>
  <text x="140" y="424" font-size="11" text-anchor="middle" fill="#6b7280">アプリの画面とプログラムを配信</text>

  <rect x="292" y="376" width="216" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="400" y="404" font-size="15" text-anchor="middle" fill="#1f2937">公開Nostrリレー</text>
  <text x="400" y="424" font-size="11" text-anchor="middle" fill="#6b7280">暗号化された接続情報を仲介</text>

  <rect x="552" y="376" width="216" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="660" y="404" font-size="15" text-anchor="middle" fill="#1f2937">Cloudflare STUN</text>
  <text x="660" y="424" font-size="11" text-anchor="middle" fill="#6b7280">外側のIPアドレスを教える</text>

  <line x1="300" y1="272" x2="160" y2="376" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="214" y="322" font-size="11" text-anchor="end" fill="#6b7280">アプリを読み込む</text>
  <line x1="400" y1="272" x2="400" y2="376" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="410" y="318" font-size="11" fill="#6b7280">接続情報を</text>
  <text x="410" y="334" font-size="11" fill="#6b7280">やり取りする</text>
  <line x1="500" y1="272" x2="640" y2="376" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="588" y="322" font-size="11" fill="#6b7280">アドレスを問い合わせる</text>
</svg>
