<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a6fd0"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" text-anchor="start" fill="#6b7280">外部サーバー3つは何をしているか</text>
  <rect x="48" y="48" width="240" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="168.0" y="76.0" font-size="15" text-anchor="middle" fill="#1f2937">GitHub Pages</text>
  <text x="168.0" y="96.0" font-size="11" text-anchor="middle" fill="#6b7280">静的ファイルのWebサーバー</text>
  <line x1="156" y1="232" x2="156" y2="112" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="146" y="166" font-size="11" text-anchor="end" fill="#6b7280">このURLを</text>
  <text x="146" y="182" font-size="11" text-anchor="end" fill="#6b7280">開きたい</text>
  <line x1="180" y1="112" x2="180" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="190" y="166" font-size="11" text-anchor="start" fill="#6b7280">画面と</text>
  <text x="190" y="182" font-size="11" text-anchor="start" fill="#6b7280">プログラム</text>
  <rect x="48" y="232" width="240" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="168.0" y="256.0" font-size="15" text-anchor="middle" fill="#1f2937">端末のブラウザ</text>
  <text x="168.0" y="276.0" font-size="11" text-anchor="middle" fill="#6b7280">QR Drop が動いている</text>
  <text x="168" y="318" font-size="10" text-anchor="middle" fill="#9ca3af">使うとき</text>
  <text x="168" y="336" font-size="12" text-anchor="middle" fill="#1f2937">最初にページを開くときだけ</text>
  <text x="168" y="364" font-size="10" text-anchor="middle" fill="#9ca3af">サーバーに見えるもの</text>
  <text x="168" y="382" font-size="12" text-anchor="middle" fill="#1f2937">端末のIPアドレス</text>
  <rect x="360" y="48" width="240" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="76.0" font-size="15" text-anchor="middle" fill="#1f2937">公開Nostrリレー</text>
  <text x="480.0" y="96.0" font-size="11" text-anchor="middle" fill="#6b7280">WebSocketで待ち受ける中継サーバー</text>
  <line x1="468" y1="232" x2="468" y2="112" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="458" y="166" font-size="11" text-anchor="end" fill="#6b7280">暗号化した</text>
  <text x="458" y="182" font-size="11" text-anchor="end" fill="#6b7280">接続情報を書く</text>
  <line x1="492" y1="112" x2="492" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="502" y="166" font-size="11" text-anchor="start" fill="#6b7280">相手のEVENTを</text>
  <text x="502" y="182" font-size="11" text-anchor="start" fill="#6b7280">受け取る</text>
  <rect x="360" y="232" width="240" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="480.0" y="256.0" font-size="15" text-anchor="middle" fill="#1f2937">端末のブラウザ</text>
  <text x="480.0" y="276.0" font-size="11" text-anchor="middle" fill="#6b7280">QR Drop が動いている</text>
  <text x="480" y="318" font-size="10" text-anchor="middle" fill="#9ca3af">使うとき</text>
  <text x="480" y="336" font-size="12" text-anchor="middle" fill="#1f2937">つながるまでの数秒だけ</text>
  <text x="480" y="364" font-size="10" text-anchor="middle" fill="#9ca3af">サーバーに見えるもの</text>
  <text x="480" y="382" font-size="12" text-anchor="middle" fill="#1f2937">タグの値と暗号文</text>
  <rect x="672" y="48" width="240" height="64" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="792.0" y="76.0" font-size="15" text-anchor="middle" fill="#1f2937">Cloudflare STUN</text>
  <text x="792.0" y="96.0" font-size="11" text-anchor="middle" fill="#6b7280">外側のIPとポートを返すサーバー</text>
  <line x1="780" y1="232" x2="780" y2="112" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="770" y="166" font-size="11" text-anchor="end" fill="#6b7280">私は外から</text>
  <text x="770" y="182" font-size="11" text-anchor="end" fill="#6b7280">どう見える？</text>
  <line x1="804" y1="112" x2="804" y2="232" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="814" y="166" font-size="11" text-anchor="start" fill="#6b7280">このアドレスと</text>
  <text x="814" y="182" font-size="11" text-anchor="start" fill="#6b7280">ポートです</text>
  <rect x="672" y="232" width="240" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="792.0" y="256.0" font-size="15" text-anchor="middle" fill="#1f2937">端末のブラウザ</text>
  <text x="792.0" y="276.0" font-size="11" text-anchor="middle" fill="#6b7280">QR Drop が動いている</text>
  <text x="792" y="318" font-size="10" text-anchor="middle" fill="#9ca3af">使うとき</text>
  <text x="792" y="336" font-size="12" text-anchor="middle" fill="#1f2937">つながる前に1回</text>
  <text x="792" y="364" font-size="10" text-anchor="middle" fill="#9ca3af">サーバーに見えるもの</text>
  <text x="792" y="382" font-size="12" text-anchor="middle" fill="#1f2937">端末のIPアドレス</text>
  <rect x="24" y="408" width="912" height="44" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="480" y="435" font-size="13" text-anchor="middle" fill="#1f2937">3つとも、ファイルは通らない。保存もされない。</text>
</svg>
