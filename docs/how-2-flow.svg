<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 736"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a6fd0"/>
    </marker>
  </defs>
  <rect width="960" height="736" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" text-anchor="start" fill="#6b7280">QRを読むとつながる理由（QRを1回読む方式）</text>
  <line x1="160" y1="104" x2="160" y2="712" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="800" y1="104" x2="800" y2="712" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="480" y1="428" x2="480" y2="540" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="60" y="48" width="200" height="56" rx="8" fill="#ffffff" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="160.0" y="72.0" font-size="15" text-anchor="middle" fill="#1f2937">端末A</text>
  <text x="160.0" y="92.0" font-size="11" text-anchor="middle" fill="#6b7280">QRを表示する側</text>
  <rect x="700" y="48" width="200" height="56" rx="8" fill="#ffffff" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="800.0" y="72.0" font-size="15" text-anchor="middle" fill="#1f2937">端末B</text>
  <text x="800.0" y="92.0" font-size="11" text-anchor="middle" fill="#6b7280">QRを読む側</text>
  <rect x="48" y="124" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="143" font-size="13" text-anchor="middle" fill="#1f2937">① 合言葉を作る</text>
  <text x="160" y="159" font-size="11" text-anchor="middle" fill="#6b7280">ランダムな値。1回きりの使い捨て</text>
  <line x1="160" y1="204" x2="800" y2="204" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="480" y="194" font-size="12" text-anchor="middle" fill="#1f2937">② QRで合言葉を渡す（画面 → カメラ。ネットワークを通らない）</text>
  <rect x="48" y="228" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="247" font-size="13" text-anchor="middle" fill="#1f2937">③ 合言葉から計算する</text>
  <text x="160" y="263" font-size="11" text-anchor="middle" fill="#6b7280">「部屋の名前」と「暗号鍵」</text>
  <rect x="688" y="228" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="800" y="247" font-size="13" text-anchor="middle" fill="#1f2937">③ 合言葉から計算する</text>
  <text x="800" y="263" font-size="11" text-anchor="middle" fill="#6b7280">「部屋の名前」と「暗号鍵」</text>
  <text x="480" y="246" font-size="11" text-anchor="middle" fill="#6b7280">同じ合言葉からは</text>
  <text x="480" y="262" font-size="11" text-anchor="middle" fill="#6b7280">同じ結果が出る</text>
  <rect x="48" y="292" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="311" font-size="13" text-anchor="middle" fill="#1f2937">④ STUNに聞く</text>
  <text x="160" y="327" font-size="11" text-anchor="middle" fill="#6b7280">自分の外側の宛先を知る</text>
  <rect x="688" y="292" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="800" y="311" font-size="13" text-anchor="middle" fill="#1f2937">④ STUNに聞く</text>
  <text x="800" y="327" font-size="11" text-anchor="middle" fill="#6b7280">自分の外側の宛先を知る</text>
  <rect x="370" y="372" width="220" height="56" rx="8" fill="#ffffff" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="396.0" font-size="15" text-anchor="middle" fill="#1f2937">公開Nostrリレー</text>
  <text x="480.0" y="416.0" font-size="11" text-anchor="middle" fill="#6b7280">掲示板。部屋の名前で区切られる</text>
  <line x1="160" y1="460" x2="480" y2="460" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="450" font-size="11" text-anchor="middle" fill="#6b7280">⑤ 暗号化した接続情報を書く</text>
  <line x1="800" y1="460" x2="480" y2="460" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="640" y="450" font-size="11" text-anchor="middle" fill="#6b7280">⑤ 暗号化した接続情報を書く</text>
  <line x1="480" y1="504" x2="160" y2="504" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="494" font-size="11" text-anchor="middle" fill="#6b7280">相手の書き込みを受け取る</text>
  <line x1="480" y1="504" x2="800" y2="504" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="640" y="494" font-size="11" text-anchor="middle" fill="#6b7280">相手の書き込みを受け取る</text>
  <text x="480" y="560" font-size="11" text-anchor="middle" fill="#6b7280">リレーの出番はここまで</text>
  <text x="480" y="576" font-size="11" text-anchor="middle" fill="#6b7280">見えるのは部屋の名前と暗号文だけ</text>
  <rect x="48" y="532" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="551" font-size="13" text-anchor="middle" fill="#1f2937">⑥ 暗号鍵で復号する</text>
  <text x="160" y="567" font-size="11" text-anchor="middle" fill="#6b7280">相手の宛先と鍵の指紋がわかる</text>
  <rect x="688" y="532" width="224" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="800" y="551" font-size="13" text-anchor="middle" fill="#1f2937">⑥ 暗号鍵で復号する</text>
  <text x="800" y="567" font-size="11" text-anchor="middle" fill="#6b7280">相手の宛先と鍵の指紋がわかる</text>
  <line x1="160" y1="628" x2="800" y2="628" stroke="#7a6fd0" stroke-width="1.5" marker-start="url(#arrow-p)" marker-end="url(#arrow-p)"/>
  <text x="480" y="618" font-size="12" text-anchor="middle" fill="#1f2937">⑦ 直接つなぐ（相手の鍵の指紋が、受け取ったものと一致するか確かめる）</text>
  <line x1="160" y1="684" x2="800" y2="684" stroke="#7a6fd0" stroke-width="2.2" marker-start="url(#arrow-p)" marker-end="url(#arrow-p)"/>
  <text x="480" y="674" font-size="12" text-anchor="middle" fill="#1f2937">⑧ ファイルを送り合う（暗号化。サーバーを通らない）</text>
</svg>
