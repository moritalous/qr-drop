<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600"
     font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="32" y="28" font-size="13" fill="#6b7280">公開Nostrリレーとは：WebSocketで待ち受け、EVENTを購読者に転送するサーバー</text>
  <rect x="24" y="48" width="912" height="232" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="72" font-size="12" text-anchor="start" fill="#6b7280">本来の使い方：分散型のSNS（Nostr という公開の規格）</text>
  <rect x="56" y="132" width="200" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="156.0" y="160.0" font-size="15" text-anchor="middle" fill="#1f2937">投稿する人のアプリ</text>
  <text x="156.0" y="180.0" font-size="11" text-anchor="middle" fill="#6b7280">短い文章を投稿する</text>
  <rect x="704" y="132" width="200" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="804.0" y="160.0" font-size="15" text-anchor="middle" fill="#1f2937">読む人のアプリ</text>
  <text x="804.0" y="180.0" font-size="11" text-anchor="middle" fill="#6b7280">タイムラインを見る</text>
  <rect x="380" y="88" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="115.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者X）</text>
  <line x1="256" y1="164" x2="380" y2="110" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="110" x2="704" y2="164" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="380" y="144" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="171.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者Y）</text>
  <line x1="256" y1="164" x2="380" y2="166" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="166" x2="704" y2="164" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="380" y="200" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="227.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者Z）</text>
  <line x1="256" y1="164" x2="380" y2="222" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="222" x2="704" y2="164" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="200" y="244" font-size="11" text-anchor="middle" fill="#6b7280">同じ投稿を</text>
  <text x="200" y="260" font-size="11" text-anchor="middle" fill="#6b7280">複数のリレーに書き込む</text>
  <text x="760" y="244" font-size="11" text-anchor="middle" fill="#6b7280">フォローした人の投稿を</text>
  <text x="760" y="260" font-size="11" text-anchor="middle" fill="#6b7280">リレーから受け取る</text>
  <rect x="24" y="304" width="912" height="232" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="328" font-size="12" text-anchor="start" fill="#6b7280">QR Drop での使い方：同じ仕組みで、接続情報（暗号文）を転送してもらう</text>
  <rect x="56" y="388" width="200" height="64" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="156.0" y="416.0" font-size="15" text-anchor="middle" fill="#1f2937">端末A</text>
  <text x="156.0" y="436.0" font-size="11" text-anchor="middle" fill="#6b7280">QR Drop</text>
  <rect x="704" y="388" width="200" height="64" rx="8" fill="none" stroke="#7a6fd0" stroke-width="1.5"/>
  <text x="804.0" y="416.0" font-size="15" text-anchor="middle" fill="#1f2937">端末B</text>
  <text x="804.0" y="436.0" font-size="11" text-anchor="middle" fill="#6b7280">QR Drop</text>
  <rect x="380" y="344" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="371.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者X）</text>
  <line x1="256" y1="420" x2="380" y2="366" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="366" x2="704" y2="420" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="380" y="400" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="427.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者Y）</text>
  <line x1="256" y1="420" x2="380" y2="422" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="422" x2="704" y2="420" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="380" y="456" width="200" height="44" rx="8" fill="none" stroke="#d9603b" stroke-width="1.5"/>
  <text x="480.0" y="483.0" font-size="13" text-anchor="middle" fill="#1f2937">リレー（運営者Z）</text>
  <line x1="256" y1="420" x2="380" y2="478" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="478" x2="704" y2="420" stroke="#6b7280" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="500" font-size="11" text-anchor="middle" fill="#6b7280">暗号化した接続情報を</text>
  <text x="200" y="516" font-size="11" text-anchor="middle" fill="#6b7280">複数のリレーに読み書きする</text>
  <text x="760" y="500" font-size="11" text-anchor="middle" fill="#6b7280">タグの値が同じEVENTだけ</text>
  <text x="760" y="516" font-size="11" text-anchor="middle" fill="#6b7280">送受信する</text>
  <text x="480" y="566" font-size="12" text-anchor="middle" fill="#1f2937">リレーは世界中の有志や企業がそれぞれ運営している。QR Drop は複数に同時に書くので、1つ止まっても動く。</text>
  <text x="480" y="586" font-size="12" text-anchor="middle" fill="#1f2937">投稿の中身は暗号化してあるので、リレーの運営者にも読めない。</text>
</svg>
